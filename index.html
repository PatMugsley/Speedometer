<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Speedometer">
  <title>Speedometer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="view-ride" class="view">
      <header class="topbar">
        <div class="status"><span id="dot" class="dot"></span><span id="status-text">Ready</span></div>
        <div class="seg" id="unit-seg" role="group" aria-label="Units">
          <button data-unit="miles">mi</button><button data-unit="kilometers">km</button>
        </div>
      </header>

      <div class="hero">
        <div id="speed" class="hero-num">0.0</div>
        <div id="speed-unit" class="hero-unit">mph</div>
      </div>

      <div class="grid">
        <div class="tile"><div class="tile-title">DISTANCE</div><div class="tile-val"><span id="distance">0.00</span><small id="distance-unit">mi</small></div></div>
        <div class="tile accent"><div class="tile-title">PACE</div><div class="tile-val"><span id="pace">--:--</span><small class="pace-unit">/mi</small></div></div>
        <div class="tile"><div class="tile-title">AVG PACE</div><div class="tile-val"><span id="avg-pace">--:--</span><small class="pace-unit">/mi</small></div></div>
        <div class="tile"><div class="tile-title">TIME</div><div class="tile-val"><span id="time">0:00</span></div></div>
        <div class="tile"><div class="tile-title">AVG SPEED</div><div class="tile-val"><span id="avg-speed">0.0</span><small class="speed-unit">mph</small></div></div>
        <div class="tile"><div class="tile-title">MAX SPEED</div><div class="tile-val"><span id="max-speed">0.0</span><small class="speed-unit">mph</small></div></div>
      </div>

      <div id="splits" class="splits" hidden>
        <div class="section-title">SPLITS</div>
        <ul id="splits-list"></ul>
      </div>

      <div id="notice" class="notice" hidden></div>
      <div id="controls" class="controls"></div>
    </section>

    <section id="view-history" class="view" hidden>
      <h1>History</h1>
      <div id="history-list"></div>
    </section>

    <section id="view-settings" class="view" hidden>
      <h1>Settings</h1>
      <div class="card">
        <label class="row" for="weight"><span>Weight</span>
          <span class="weight"><input id="weight" type="number" inputmode="decimal" min="50" max="700" step="1"><span id="weight-unit">lb</span></span>
        </label>
      </div>
      <p class="hint">Used for calorie estimates.</p>
      <div class="card">
        <button class="row link" id="export">Export rides (JSON)</button>
      </div>
      <p class="hint">Rides are stored in this browser only. Export now and then as a backup.</p>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="ride" class="active"><svg viewBox="0 0 24 24"><path d="M12 4a9 9 0 0 0-9 9c0 2 .6 3.800 1.700 5.300h14.600A9 9 0 0 0 12 4zm0 0v3m4.500 1.500-1.800 1.800M12 13l4-4"/></svg>Ride</button>
    <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M3.500 12a8.500 8.500 0 1 0 2.500-6M3.500 4v4.500H8M12 7.500V12l3 2"/></svg>History</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.500v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M5.300 18.700l2.100-2.100M16.600 7.400l2.100-2.100"/></svg>Settings</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bar"><button id="sheet-back" class="pill">Done</button><div id="sheet-title" class="sheet-title"></div><button id="sheet-delete" class="pill danger" hidden>Delete</button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
